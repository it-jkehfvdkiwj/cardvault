<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Cardeva — Pokémon-Sammlung scannen, verwalten & verkaufen</title>
    <meta
      name="description"
      content="Pokémon-Karten mit dem Handy scannen, automatisch erkennen lassen, Marktpreise verfolgen und mit einem Klick auf eBay, Whatnot & Vinted verkaufen. Kostenlos starten."
    />
    <meta name="robots" content="index, follow" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/pokeball.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme: matches the app background so mobile browser chrome blends in -->
    <meta name="theme-color" content="#FAFAF8" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cardeva" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS turns bare numbers into phone links, which mangles card numbers. -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph — WhatsApp / Facebook / Discord / LinkedIn link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cardeva" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="Cardeva — Pokémon-Sammlung scannen & verkaufen" />
    <meta
      property="og:description"
      content="Karte fotografieren, automatisch erkennen lassen, Marktpreise verfolgen und mit einem Klick auf eBay listen."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cardeva — Scannen. Verwalten. Verkaufen." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cardeva — Pokémon-Sammlung scannen & verkaufen" />
    <meta
      name="twitter:description"
      content="Karte fotografieren, automatisch erkennen lassen, Marktpreise verfolgen und mit einem Klick auf eBay listen."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts are bundled with the app (see src/index.css) rather than loaded
         from Google, so no visitor IP is sent to a third party. -->

    <!-- Rich result for the landing page -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Cardeva",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "de",
        "description": "Pokémon-Karten scannen, Sammlung verwalten, Marktpreise verfolgen und auf eBay verkaufen.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:36rem;margin:15vh auto;padding:0 1.5rem;font-family:system-ui,sans-serif;color:#44443F;text-align:center">
        <h1 style="color:#1A1A17">Cardeva</h1>
        <p>
          Für Cardeva muss JavaScript aktiviert sein. Bitte aktiviere es in den
          Browser-Einstellungen und lade die Seite neu.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
