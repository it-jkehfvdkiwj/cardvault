# TLS-Overlay: stellt Caddy vor die App und holt automatisch ein
# Let's-Encrypt-Zertifikat.
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#
# Voraussetzung: SITE_DOMAIN und ACME_EMAIL stehen in der .env, und die Domain
# zeigt per A-Record (und optional AAAA) auf diesen Server.
#
# Warum eine eigene Datei: ohne Domain (z. B. lokal) willst du kein Caddy, das
# vergeblich Zertifikate anfragt. So bleibt die Basis-Datei überall lauffähig.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'      # nötig für die Let's-Encrypt-Prüfung + http→https-Weiterleitung
      - '443:443'
      - '443:443/udp'  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # Zertifikate — muss persistent sein, sonst
      - caddy_config:/config  # holt Caddy bei jedem Neustart neue an und
                              # läuft irgendwann in Let's-Encrypt-Limits
    environment:
      # Quoted aus demselben Grund wie in docker-compose.yml.
      - "SITE_DOMAIN=${SITE_DOMAIN:?fehlt in der .env, z. B. cardeva.de}"
      - "ACME_EMAIL=${ACME_EMAIL:?fehlt in der .env}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
